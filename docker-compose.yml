name: fashion-erp-backend

services:
  api:
    build:
      context: .
      target: development
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-4000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/usr/src/app
      - api_node_modules:/usr/src/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fashion-erp-network

  mysql:
    image: mysql:8.0.40
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-fashion_erp}
      MYSQL_USER: ${DB_USERNAME:-fashion_erp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fashion_erp}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-fashion_erp_root}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD:-fashion_erp_root}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - fashion-erp-network

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - fashion-erp-network

networks:
  fashion-erp-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  api_node_modules:
